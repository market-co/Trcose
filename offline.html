
<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">

  <title>Trcose Market - Offline</title>
  <style>

      margin: 0;

      background: #f4f7ff;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #172b4d;
      padding: 20px;
    }
    .card {
      max-width: 420px;
      background: white;
      padding: 35px 24px;
      border-radius: 22px;
      box-shadow: 0 8px 30px #173b7020;
    }
    .logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
    }
    h1 { color: #1769ff; }
    p { line-height: 1.7; }
    button {
      background: #1769ff;
      color: white;
      border: 0;
      padding: 14px 25px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/Trcose/icons/trcose-icon-192.png" alt="Trcose">

    <p>Internet yawe yacitse. Ongera ugerageze gufungura Trcose igihe internet igarutse.</p>

</html>
