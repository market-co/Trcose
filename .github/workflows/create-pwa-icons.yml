
name: Create Trcose PWA Icons

on:
  workflow_dispatch:

jobs:
  create-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Convert SVG to PNG icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 192 -h 192 icons/trcose-ai-logo.svg -o icons/trcose-icon-192.png
          rsvg-convert -w 512 -h 512 icons/trcose-ai-logo.svg -o icons/trcose-icon-512.png

      - name: Save PNG icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/trcose-icon-192.png icons/trcose-icon-512.png
          git commit -m "Create Trcose PWA PNG icons" || echo "No changes"
          git push
